# 在项目根目录运行 mlx_lm.lora，路径指向 Git 忽略的试验目录。
model: qlora/output/mlx-logistics/model
data: qlora/output/mlx-logistics/data
adapter_path: qlora/output/mlx-logistics/adapter
train: true
fine_tune_type: lora
mask_prompt: true
seed: 42
batch_size: 1
max_seq_length: 768
iters: 18
num_layers: 16
optimizer: adamw
learning_rate: 0.0001
val_batches: -1
steps_per_report: 1
steps_per_eval: 6
save_every: 6
grad_checkpoint: true
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.v_proj]
